<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in - Transit ETA</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4"><main class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-8"><h1 class="mb-2 text-center text-2xl font-bold">Transit<span class="text-cyan-400">ETA</span></h1><p class="mb-6 text-center text-sm text-slate-400">Sign in to access the operations dashboard.</p>{% if error %}<p class="mb-4 rounded bg-red-500/20 p-3 text-sm text-red-200">{{ error }}</p>{% endif %}<form method="post" class="space-y-4"><label class="block text-sm">Username<input name="username" type="text" autocomplete="username" required autofocus class="mt-1 w-full rounded border border-slate-700 bg-slate-800 p-2"></label><label class="block text-sm">Password<input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded border border-slate-700 bg-slate-800 p-2"></label><button class="w-full rounded bg-cyan-500 p-2 font-semibold text-slate-950">Sign in securely</button></form></main></body></html>
